<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Le Cabinet de Dobby</title>
	<link href="./common.css" rel="stylesheet" />
	<link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
	<style>
		html, body, #n8n-chat {
			width: 100%;
			height: 100%;
			font-family: 'Cormorant Garamond', serif;
		}

		/* Variables CSS du chat */
		:root {
			--chat--color--primary: #d6b36a;
			--chat--color--primary-shade-50: #bc9650;
			--chat--color--primary--shade-100: #9d7638;
			--chat--color--secondary: #261912;
			--chat--color-secondary-shade-50: #1a120d;
			
			--chat--color-white: #fff8e7;
			--chat--color-light: #f2e6c9;
			--chat--color-light-shade-50: #d7c7a4;
			--chat--color-light-shade-100: #b89f78;
			--chat--color-medium: #9f8664;
			--chat--color-dark: #1f140f;
			--chat--color-disabled: #7b6850;
			--chat--color-typing: #e8d9b4;

			--chat--spacing: 1rem;
			--chat--border-radius: 1rem;
			--chat--transition-duration: 0.3s;

			--chat--window--width: 100%;
			--chat--window--height: 100%;

			--chat--header-height: auto;
			--chat--header--padding: 1.75rem 1.4rem 1.35rem;
			--chat--header--background: linear-gradient(180deg, rgba(33, 22, 16, 0.95), rgba(19, 14, 11, 0.92));
			--chat--header--color: #fff4d7;
			--chat--header--border-top: none;
			--chat--header--border-bottom: 1px solid rgba(214, 179, 106, 0.45);
			--chat--heading--font-size: 2rem;
			--chat--subtitle--font-size: 1rem;
			--chat--subtitle--line-height: 1.5;
			--chat--subtitle--font-weight: 500;

			--chat--textarea--height: 64px;
			--chat--textarea--border-radius: 18px;
			--chat--textarea--border: 1px solid rgba(214, 179, 106, 0.4);
			--chat--textarea--focus-border: 1px solid #d6b36a;

			--chat--message--font-size: 1.12rem;
			--chat--message--padding: 0.875rem 1rem;
			--chat--message--border-radius: 1.25rem;
			--chat--message-line-height: 1.55;
			
			--chat--message--bot--background: linear-gradient(180deg, rgba(250, 240, 209, 0.96), rgba(232, 212, 171, 0.92));
			--chat--message--bot--color: #2f2016;
			--chat--message--bot--border: 1px solid rgba(133, 91, 45, 0.24);
			--chat--message--bot--shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
			
			--chat--message--user--background: linear-gradient(135deg, #f5e8c9, #e8d0a0 58%, #d1aa69 100%);
			--chat--message--user--color: #2b1c13;
			--chat--message--user--border: 1px solid rgba(118, 84, 43, 0.28);
			
			--chat--message--pre--background: rgba(37, 22, 14, 0.09);

			--chat--toggle--background: #d6b36a;
			--chat--toggle--hover--background: #bc9650;
			--chat--toggle--active--background: #9d7638;
			--chat--toggle--color: #1f140f;
			--chat--toggle--size: 64px;
		}

		#n8n-chat {
			box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.2);
			border-radius: 0;
		}

		.n8n-chat {
			background: transparent;
		}

		.n8n-chat .n8n-chat-window {
			background: linear-gradient(180deg, rgba(22, 15, 11, 0.56), rgba(31, 22, 16, 0.28));
			backdrop-filter: blur(12px);
		}

		.n8n-chat .n8n-chat-header {
			position: relative;
			overflow: hidden;
		}

		.n8n-chat .n8n-chat-header::before {
			content: '✦  Chambre des requêtes de Dobby  ✦';
			display: block;
			margin-bottom: 0.45rem;
			font-family: 'Cinzel', serif;
			font-size: 0.78rem;
			letter-spacing: 0.24rem;
			text-transform: uppercase;
			color: rgba(214, 179, 106, 0.84);
		}

		.n8n-chat .n8n-chat-header h1,
		.n8n-chat .n8n-chat-header .n8n-chat-title {
			font-family: 'Cinzel', serif;
			font-weight: 700;
			letter-spacing: 0.04rem;
		}

		.n8n-chat .n8n-chat-header p,
		.n8n-chat .n8n-chat-header .n8n-chat-subtitle {
			max-width: 38rem;
			color: rgba(255, 244, 215, 0.85);
		}

		.n8n-chat .n8n-chat-body {
			background:
				linear-gradient(180deg, rgba(32, 23, 17, 0.42), rgba(18, 13, 10, 0.58)),
				radial-gradient(circle at top, rgba(214, 179, 106, 0.08), transparent 28%);
		}

		.n8n-chat .n8n-chat-footer {
			background: rgba(20, 14, 11, 0.78);
			border-top: 1px solid rgba(214, 179, 106, 0.28);
		}

		.n8n-chat textarea,
		.n8n-chat input {
			background: rgba(255, 248, 231, 0.94);
			color: #2f2016;
			font-size: 1.06rem;
			box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 8px 18px rgba(0, 0, 0, 0.14);
		}

		.n8n-chat textarea::placeholder,
		.n8n-chat input::placeholder {
			color: #7a6245;
		}

		@keyframes modernSpin {
			0% { transform: rotate(0deg); }
			100% { transform: rotate(360deg); }
		}

		@keyframes pulse {
			0%, 100% { opacity: 1; }
			50% { opacity: 0.5; }
		}

		.n8n-chat .n8n-loading {
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.n8n-chat .n8n-loading::after {
			content: '';
			width: 24px;
			height: 24px;
			border: 3px solid rgba(255, 245, 223, 0.22);
			border-top: 3px solid #d6b36a;
			border-radius: 50%;
			animation: modernSpin 1s linear infinite;
		}

		/* Animation des messages */
		.n8n-chat .n8n-message {
			animation: slideInUp 0.3s ease-out;
		}

		.n8n-chat .chat-message.chat-message-from-user {
			background: var(--chat--message--user--background);
			color: var(--chat--message--user--color);
			border: var(--chat--message--user--border);
		}

		@keyframes slideInUp {
			from {
				opacity: 0;
				transform: translateY(20px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		.n8n-chat input,
		.n8n-chat textarea,
		.n8n-chat button {
			transition: all 0.3s ease;
		}

		.n8n-chat button:hover {
			transform: translateY(-1px);
			box-shadow: 0 8px 20px rgba(214, 179, 106, 0.22);
		}

		.n8n-chat button:active {
			transform: translateY(0);
		}

		.n8n-chat a {
			color: #d6b36a;
			text-decoration: none;
			border-bottom: 1px solid transparent;
			transition: border-color 0.2s ease;
		}

		.n8n-chat a:hover {
			border-bottom-color: #d6b36a;
		}

		.n8n-chat ::-webkit-scrollbar {
			width: 6px;
		}

		.n8n-chat ::-webkit-scrollbar-track {
			background: rgba(255, 248, 231, 0.08);
		}

		.n8n-chat ::-webkit-scrollbar-thumb {
			background: #9d7638;
			border-radius: 3px;
		}

		.n8n-chat ::-webkit-scrollbar-thumb:hover {
			background: #d6b36a;
		}

		/* Responsive */
		@media (max-width: 768px) {
		}

	</style>
	<script src="./common.js"></script>
	<script type="module">
		import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';
		const {
			createHermioneTipNotifier,
			createModelSelector,
			generateSessionId,
			getQueryParam,
			initDisclosureMenu,
		} = window.TalkAppCommon;

		const hermioneTipNotifier = createHermioneTipNotifier({
			endpointUrl: `${window.location.origin}/webhook/webhook/hermione_tip`,
			onError: (error) => {
				console.warn('Impossible de recuperer un conseil de Hermione:', error);
			},
		});

		const modelSelector = createModelSelector({
			getNotificationText: (modelType) => {
				switch (modelType) {
					case 'local':
						return 'Dobby ouvre le passage vers le foyer local...';
					case 'lavoisier':
						return 'Dobby ouvre le passage vers le réseau Lavoisier...';
					default:
						return 'Dobby ouvre le passage vers le cabinet...';
				}
			},
		});

		/**
		 * Génère le message de subtitle en fonction du modèle
		 * @param {string} model - Nom du modèle
		 * @returns {string} - Message pour la bannière
		 */
		function getSubtitleMessage(model) {
			switch(model) {
				case 'local':
					return '🕯️ Foyer local • Les réponses restent dans votre propre salle commune';
				case 'lavoisier':
					return '🏰 Réseau Lavoisier • Dobby consulte les savoirs du château à distance';
				default:
					return '🕯️ Foyer local • Les réponses restent dans votre propre salle commune';
			}
		}

		// Récupération des paramètres depuis l'URL
		const sessionId = getQueryParam('sessionId') || generateSessionId();
		const llmModel = modelSelector.getCurrentModel();

		// Configuration et initialisation du chat
		createChat({

			webhookUrl: window.location.origin + '/webhook/webhook/16fec379-eddf-40de-b967-7b8c3125db24/chat',
			mode: 'fullscreen',
			
			// Métadonnées dynamiques extraites de l'URL
			metadata: {
				sessionId: sessionId,
				llmModel: llmModel,
				userAgent: navigator.userAgent,
				timestamp: new Date().toISOString()
			},
			
			// Configuration de la session
			chatSessionKey: 'sessionId',
			loadPreviousSession: true,
			
			enableStreaming: true,

			// Messages initiaux
			initialMessages: [
				'Dobby vous souhaite la bienvenue dans le cabinet enchanté.',
				'Parlez à Dobby comme à votre elfe de maison: il fouillera grimoires, notes et archives pour vous répondre.'
			],
			
			// Internationalisation
			defaultLanguage: 'fr',
			i18n: {
				fr: {
					title: 'Dobby, elfe de maison',
					subtitle: getSubtitleMessage(llmModel),
					footer: 'Relié aux outils du château via n8n',
					getStarted: 'Ouvrir un nouveau grimoire',
					inputPlaceholder: 'Que souhaitez-vous demander à Dobby ?',
				}
			},
			
			// Configuration du webhook
			webhookConfig: {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				}
			}
		});

		// Log des paramètres pour le débogage (à retirer en production)
		console.log('🔧 Configuration du chat:', {
			sessionId,
			llmModel,
			url: window.location.href
		});

		// Gestion du menu d'administration et du sélecteur de modèle
		document.addEventListener('DOMContentLoaded', () => {
			// Initialiser le sélecteur de modèle
			modelSelector.init();
			hermioneTipNotifier.start();

			initDisclosureMenu({ toggleSelector: '.menu-toggle', contentSelector: '.menu-content' });
		});
	</script>
</head>
<body class="hp-app hp-app--fixed">
	<!-- Sélecteur de modèle -->
	<div class="model-selector">
		<button class="model-btn" data-model="local" title="Modèle local (sécurisé, privé)">
			<span class="model-icon">🕯️</span>
			<span class="model-copy">
				<strong>Local</strong>
				<span>foyer prive</span>
			</span>
			<span class="model-status local"></span>
		</button>
		<button class="model-btn" data-model="lavoisier" title="Envoi vers le service Lavoisier">
			<span class="model-icon">🏰</span>
			<span class="model-copy">
				<strong>Lavoisier</strong>
				<span>reseau du chateau</span>
			</span>
			<span class="model-status lavoisier"></span>
		</button>
	</div>

	<!-- Notification de changement de modèle -->
	<div class="model-notification"></div>
	<div class="hermione-tip-stack" aria-live="polite" aria-atomic="false"></div>

	<!-- Menu d'administration RAG -->
	<div class="admin-menu">
		<button class="menu-toggle" aria-label="Menu administration" title="Menu administration">
			⚙️
		</button>
		<div class="menu-content">
			<div class="menu-header">
				<h3>Administration</h3>
			</div>

			<!-- Section RAG -->
			<div class="menu-section">
				<p class="menu-section-title">Gestion RAG <span class="menu-badge">3</span></p>
				<a href="/rag/upload-documents" class="menu-item primary" target="_blank">
					Uploader des documents
				</a>
				<a href="/rag/web-scraping" class="menu-item" target="_blank">
					Scraper un site web
				</a>
				<a href="/rag/image-analyse" class="menu-item" target="_blank">
					Analyser une image
				</a>
				<a href="/qdrant-collections" class="menu-item" target="_blank">
					🗄️ Collections Qdrant
				</a>
			</div>

			<!-- Footer -->
			<div class="menu-footer">
				<a href="http://localhost:5678/" target="_blank">Interface n8n local →</a>
			</div>
		</div>
	</div>

	<!-- Le chat sera injecté ici automatiquement -->
</body>
</html>
